name: Windows 312TheGathering debug package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft prerelease tag (club-offline-debug- followed by a commit SHA)
        required: true
        type: string

permissions: {}
concurrency:
  group: club-offline-publisher-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the commit named by the tag
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          [[ "$TAG" =~ ^club-offline-debug-([0-9a-f]{7,40})$ ]]
          prefix=${BASH_REMATCH[1]}
          sha=$(git rev-parse --verify "$prefix^{commit}")
          [[ "$sha" == "$prefix"* ]]
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$sha" ]]
          fi
          git checkout --detach "$sha"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build the Windows package
        env:
          CLUB_OFFLINE_TARGET: windows-amd64
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash deploy/club/build.sh build/portable
          (cd build/portable && sha256sum --check *.zip.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-offline
          path: build/portable/312TheGathering-debug-windows-amd64-*.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  smoke:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-offline
      - name: Run the packaged launcher, card catalog and Forge on Windows
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          CLUB_NO_BROWSER: '1'
          CLUB_PORT: '57325'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-Item "312TheGathering-debug-windows-amd64-$($env:SOURCE_SHA.Substring(0,12)).zip"
          $expected = ((Get-Content "$($zip.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'ZIP checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'Offline Club smoke'
          7z x $zip.FullName "-o$dest" -bd -bso0
          if ($LASTEXITCODE) { throw 'ZIP extraction failed' }
          $club = Join-Path $dest '312TheGathering'
          if ((Get-Content "$club/BUILD.txt") -notcontains "Source: $env:SOURCE_SHA") { throw 'Wrong packaged source' }
          $launcher = Start-Process cmd.exe -ArgumentList '/d /c Start-Club.cmd' -WorkingDirectory $club -PassThru
          try {
            $url = "http://127.0.0.1:$env:CLUB_PORT"
            $ready = $false
            for ($i = 0; $i -lt 90 -and !$ready; $i++) {
              if ($launcher.HasExited) { throw 'Club launcher exited during startup' }
              try { $ready = (Invoke-RestMethod "$url/readyz" -TimeoutSec 2).ready }
              catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Club never reported ready' }
            $homePage = Invoke-WebRequest "$url/"
            if ($homePage.StatusCode -ne 200 -or !$homePage.Content.Contains('<title>312TheGathering</title>')) { throw '312TheGathering UI unavailable' }
            if ((Invoke-RestMethod "$url/card-search?name=Lightning%20Bolt").cards.name -notcontains 'Lightning Bolt') {
              throw 'Offline card catalog unavailable'
            }

            foreach ($slug in @('modovintage', '100-ornithopters')) {
              $cube = Invoke-RestMethod "$url/club-cubes/$slug"
              $cardCount = ($cube.cards | Measure-Object -Property count -Sum).Sum
              if ($cube.slug -ne $slug -or $cardCount -lt 360) { throw "Bundled Cube unavailable: $slug" }
            }

            $deck = @()
            $sideboard = @()
            $side = $false
            foreach ($line in Get-Content "$club/offline-demo.txt") {
              if ($line -eq 'Sideboard') { $side = $true }
              if ($line -match '^(\d+) (.+) \(([A-Z0-9]+)\) (\S+)$') {
                $cards = @(@{ name=$Matches[2]; setCode=$Matches[3]; collectorNumber=$Matches[4] }) * [int]$Matches[1]
                if ($side) { $sideboard += $cards } else { $deck += $cards }
              }
            }
            if ($deck.Count -ne 60) { throw 'Demo deck could not be read' }
            $players = @(1,2 | ForEach-Object { @{ name="Seat $_"; deck=$deck; sideboard=$sideboard } })
            $game = @{ gameId='windows-smoke'; variant='constructed'; deckFormat='modern'; seed=42; startingLife=20; startingPlayerIndex=0; players=$players }
            $start = @{ command='startGame'; payload=($game | ConvertTo-Json -Depth 8 -Compress) } | ConvertTo-Json -Compress
            $commands = @($start, '{"command":"awaitPrompt","sessionId":"windows-smoke","timeoutMs":30000}', '{"command":"quit"}')
            $runtime = "$club/hexproof-forge-runtime"
            $lines = $commands | & "$club/jre/bin/java.exe" -Xmx1g '-Djava.awt.headless=true' -cp "$club/forge-overlay.jar;$runtime/forge-harness.jar" org.hexproof.forge.NativeHost --interactive-server --forge-home "$runtime/forge-gui"
            if ($LASTEXITCODE -or $lines.Count -ne 2) { throw 'Forge worker could not open a game' }
            $reply = $lines[1] | ConvertFrom-Json
            if (!$reply.ok -or ($reply.result | ConvertFrom-Json).input.type -ne 'mulligan') { throw 'Demo match failed to start' }
          } finally {
            if (!$launcher.HasExited) { taskkill.exe /PID $launcher.Id /T /F | Out-Null }
          }

  attach:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-offline
      - name: Attach verified files to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^club-offline-debug-([0-9a-f]{7,40})$ ]]
          prefix=${BASH_REMATCH[1]}
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$prefix"* ]]
          zip="312TheGathering-debug-windows-amd64-${SOURCE_SHA:0:12}.zip"
          checksum="$zip.sha256"
          actual=$(sha256sum "$zip")
          [[ "$actual" == "$(cat "$checksum")" ]]

          releases="repos/$GITHUB_REPOSITORY/releases"
          id=$(gh api --paginate "$releases" --jq '.[]' | jq -es --arg tag "$TAG" '
            map(select(.tag_name == $tag)) | if length == 1 then .[0].id else error("Expected one existing release") end')
          for asset in "$zip" "$checksum"; do
            # Drafts may not have Git tag refs yet. Re-read this exact release before each upload.
            release=$(gh api "$releases/$id")
            jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '
              .tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == true
            ' <<< "$release" >/dev/null
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            existing=$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // "unknown"' <<< "$release")
            if [[ -n "$existing" ]]; then
              [[ "$existing" == "$digest" ]] || { echo "Existing $asset has different content"; exit 1; }
              continue
            fi
            curl --fail-with-body --silent --show-error -o /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" "https://uploads.github.com/$releases/$id/assets?name=$asset"
          done
