name: Build Forge adapter 43 draft assets
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_COMMIT: eb13e76df179cdd10ff974ac73e4c767bec2412a
  UPSTREAM_COMMIT: 230914a40a9e1e767391c3be990a349015b35761
  PACKAGE_SUFFIX: 230914a40a9e1e767391c3be990a349015b35761-adapter43
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: eb13e76df179cdd10ff974ac73e4c767bec2412a
          persist-credentials: false
      - name: Verify application and select original toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          jq -e --arg rev "$UPSTREAM_COMMIT" '.revision==$rev and .adapterRevision==43' third_party/forge-runtime/native-host/upstream.json
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://download.java.net/java/GA/jdk21/fd2272bbf8e04c3dbaee13770090416c/35/GPL/openjdk-21_linux-x64_bin.tar.gz -o jdk.tar.gz
          echo "a30c454a9bef8f46d5f1bf3122830014a8fbe7ac03b5f8729bc3add4b92a1d0a  jdk.tar.gz" | sha256sum -c
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz -o maven.tgz
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  maven.tgz" | sha512sum -c
          tar -xzf jdk.tar.gz
          tar -xzf maven.tgz
          echo "$RUNNER_TEMP/jdk-21/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-21" >> "$GITHUB_ENV"
          echo "JAVA_HOME_21_A=$RUNNER_TEMP/jdk-21" >> "$GITHUB_ENV"
      - name: Build and verify release from the selected commit
        env:
          MAVEN_OPTS: -Xmx1600m
        run: |
          set -euo pipefail
          java -version
          mvn -version
          ./third_party/forge-runtime/build.sh
          dir=build/forge-runtime
          runtime="hexproof-forge-runtime-$PACKAGE_SUFFIX.tar.gz"
          source="hexproof-forge-source-$PACKAGE_SUFFIX.tar.gz"
          (cd "$dir" && sha256sum -c "hexproof-forge-$PACKAGE_SUFFIX.sha256")
          python3 third_party/forge-runtime/source-package.py verify-release --runtime "$dir/$runtime" --source "$dir/$source"
          mkdir -p verified
          cp "$dir/$runtime" "$dir/$source" verified/
          cp "$dir/hexproof-forge-$PACKAGE_SUFFIX.sha256" verified/SHA256SUMS
          (cd verified && sha256sum -c SHA256SUMS && wc -c ./*) | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain verified assets for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: forge-adapter43-paired
          path: verified/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Retrieve verified pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n forge-adapter43-paired --dir verified
      - name: Attach to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: "460264972"
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS
          tag="forge-runtime-$PACKAGE_SUFFIX"
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api "$endpoint" | jq -e --arg c "$SOURCE_COMMIT" --arg tag "$tag" '.draft and .prerelease and .tag_name==$tag and .target_commitish==$c'
          for file in "hexproof-forge-runtime-$PACKAGE_SUFFIX.tar.gz" "hexproof-forge-source-$PACKAGE_SUFFIX.tar.gz" SHA256SUMS; do
            digest="sha256:$(sha256sum "$file" | cut -d" " -f1)"
            bytes=$(stat -c %s "$file")
            matches() {
              gh api "$endpoint" | jq -e --arg n "$file" --arg h "$digest" --argjson size "$bytes" '.draft and ([.assets[] | select(.name==$n and .digest==$h and .size==$size)] | length==1)' >/dev/null
            }
            if ! matches; then
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$file"
              matches
            fi
            echo "$digest $bytes $file" | tee -a "$GITHUB_STEP_SUMMARY"
          done
